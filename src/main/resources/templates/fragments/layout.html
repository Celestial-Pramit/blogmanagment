<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="pageHead(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' · Inkwell'">Inkwell</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>

<nav th:fragment="navbar" class="nav-glass">
    <div class="nav-inner">
        <a href="/" class="brand">
            <span class="brand-mark"></span>
            <span>Inkwell</span>
        </a>
        <div class="nav-links">
            <a href="/" class="nav-link">Feed</a>
            <div sec:authorize="isAuthenticated()" class="nav-authed">
                <a href="/blogs/new" class="btn btn-primary btn-sm">New post</a>
                <span class="nav-user" sec:authentication="name"></span>
                <form action="/logout" method="post" class="nav-logout-form">
                    <button type="submit" class="btn-text">Sign out</button>
                </form>
            </div>
            <div sec:authorize="!isAuthenticated()" class="nav-guest">
                <a href="/auth/login" class="btn-text">Sign in</a>
                <a href="/auth/register" class="btn btn-secondary btn-sm">Sign up</a>
            </div>
        </div>
    </div>
</nav>

<footer th:fragment="footer" class="site-footer">
    <div class="footer-inner">
        <span class="footer-brand">Inkwell</span>
        <span class="footer-note">A place to write things down.</span>
    </div>
</footer>

</body>
</html>
