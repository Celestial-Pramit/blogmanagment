<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: pageHead('Sign in')}"></head>
<body>
<nav class="nav-glass">
    <div class="nav-inner">
        <a href="/" class="brand"><span class="brand-mark"></span><span>Inkwell</span></a>
        <a href="/" class="nav-link">&larr; Back to feed</a>
    </div>
</nav>

<main class="container container-auth">
    <div class="form-card glass">
        <h1 class="form-title">Welcome back</h1>

        <div th:if="${param.error}" class="alert alert-error">
            <span>Incorrect email or password.</span>
        </div>
        <div th:replace="~{fragments/alerts :: alerts}"></div>

        <form th:action="@{/auth/login}" method="post">
            <div class="form-group">
                <label for="username">Email</label>
                <input type="email" id="username" name="username" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-full">Sign in</button>
        </form>

        <div class="demo-login">
            <button type="button" id="fill-demo" class="btn-text">Use demo login</button>
            <span class="demo-login-hint">editorial@inkwell.dev / inkwell-demo-2026</span>
        </div>

        <p class="form-footer-note">No account? <a href="/auth/register">Sign up</a></p>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script>
document.addEventListener("DOMContentLoaded", function () {
    document.getElementById("fill-demo").addEventListener("click", function () {
        document.getElementById("username").value = "editorial@inkwell.dev";
        document.getElementById("password").value = "inkwell-demo-2026";
    });
});
</script>
</body>
</html>
