<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: pageHead('Sign up')}"></head>
<body>
<nav class="nav-glass">
    <div class="nav-inner">
        <a href="/" class="brand"><span class="brand-mark"></span><span>Inkwell</span></a>
        <a href="/" class="nav-link">&larr; Back to feed</a>
    </div>
</nav>

<main class="container container-auth">
    <div class="form-card glass">
        <h1 class="form-title">Create your account</h1>
        <div th:replace="~{fragments/alerts :: alerts}"></div>

        <form th:action="@{/auth/register}" method="post">
            <div class="form-group">
                <label for="displayName">Display name</label>
                <input type="text" id="displayName" name="displayName" maxlength="100" required autofocus>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="password">Password <span class="hint">(min. 6 characters)</span></label>
                <input type="password" id="password" name="password" minlength="6" required>
            </div>
            <button type="submit" class="btn btn-primary btn-full">Create account</button>
        </form>

        <p class="form-footer-note">Already have an account? <a href="/auth/login">Sign in</a></p>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
