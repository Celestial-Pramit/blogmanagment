<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: pageHead('Feed')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<section class="hero">
    <div class="hero-inner">
        <span class="hero-eyebrow">A shared publication</span>
        <h1 class="hero-title">Ideas worth <span class="text-gradient">writing down.</span></h1>
        <p class="hero-subtitle">A space for public essays and private drafts — sign in to write, or just read.</p>
    </div>
</section>

<main class="container">
    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <div th:if="${#lists.isEmpty(feed.items)}" class="empty-state">
        <p>No posts yet. <a th:href="@{/blogs/new}">Be the first to write one.</a></p>
    </div>

    <div th:unless="${#lists.isEmpty(feed.items)}" class="bento-grid" id="feed-grid">
        <article th:each="post, iter : ${feed.items}"
                  class="bento-item"
                  th:classappend="${iter.index == 0} ? 'bento-item--feature' : 'bento-item--standard'">
            <a th:href="@{'/blogs/' + ${post.slug}}" class="card-link">
                <div class="card-image" th:if="${post.coverImageUrl}"
                     th:style="'background-image:url(' + ${post.coverImageUrl} + ')'"></div>
                <div class="card-body">
                    <div class="card-meta-row">
                        <span class="badge"
                              th:classappend="${post.visibility.name() == 'PRIVATE'} ? 'badge-private' : 'badge-public'"
                              th:text="${post.visibility.name() == 'PRIVATE'} ? 'Private' : 'Public'"></span>
                        <span class="card-date" th:text="${#temporals.format(post.createdAt, 'MMM d, yyyy')}"></span>
                    </div>
                    <h2 class="card-title" th:text="${post.title}"></h2>
                    <p class="card-excerpt" th:text="${post.excerpt}"></p>
                    <div class="card-footer">
                        <span class="card-author" th:text="${post.authorName}"></span>
                        <span class="card-tags" th:if="${!#lists.isEmpty(post.tags)}">
                            <span class="tag-pill" th:each="t : ${post.tags}" th:text="${t}"></span>
                        </span>
                    </div>
                </div>
            </a>
        </article>
    </div>

    <div class="pagination" th:if="${feed.totalPages > 1}">
        <a th:each="p : ${#numbers.sequence(0, feed.totalPages - 1)}"
           th:href="@{/(page=${p})}"
           th:classappend="${p == feed.page} ? 'page-link active' : 'page-link'"
           th:text="${p + 1}"></a>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:src="@{/js/toast.js}"></script>
</body>
</html>
